# Hookify Test Cases
# Data-driven test configuration for hookify rules
#
# Format:
#   - name: descriptive test name
#     tool: Bash (or Read/Edit/Write)
#     command: the command to test (for Bash tool)
#     expect: block | warn | allow

test_cases:
  # =============================================================================
  # SOPS Decryption (block-sops-decrypt)
  # =============================================================================
  - name: "block-sops-decrypt: sops -d"
    tool: Bash
    command: "sops -d secrets.yaml"
    expect: block

  - name: "block-sops-decrypt: sops --decrypt"
    tool: Bash
    command: "sops --decrypt config.enc"
    expect: block

  - name: "block-sops-decrypt: sops exec-env"
    tool: Bash
    command: "sops exec-env secrets.yaml 'printenv'"
    expect: block

  - name: "block-sops-decrypt: sops exec-file"
    tool: Bash
    command: "sops exec-file secrets.yaml 'cat {}'"
    expect: block

  - name: "block-sops-decrypt: allows sops -e (encrypt)"
    tool: Bash
    command: "sops -e secrets.yaml"
    expect: allow

  - name: "block-sops-decrypt: allows sops --version"
    tool: Bash
    command: "sops --version"
    expect: allow

  # =============================================================================
  # Environment Variable Grep (block-env-grep)
  # =============================================================================
  - name: "block-env-grep: env | grep"
    tool: Bash
    command: "env | grep SECRET"
    expect: block

  - name: "block-env-grep: printenv | grep"
    tool: Bash
    command: "printenv | grep TOKEN"
    expect: block

  - name: "block-env-grep: env | cut is safe (keys only)"
    tool: Bash
    command: "env | cut -d= -f1"
    expect: allow

  - name: "block-env-grep: env | wc is safe (count only)"
    tool: Bash
    command: "env | wc -l"
    expect: allow

  - name: "block-env-grep: cross-line env + grep not blocked (grep-tool warns)"
    tool: Bash
    command: "echo environment\n| grep pattern"
    expect: warn

  - name: "block-env-grep: myenv | grep not blocked (word boundary, grep-tool warns)"
    tool: Bash
    command: "myenv | grep foo"
    expect: warn

  - name: "block-env-grep: setenv | grep not blocked (word boundary, grep-tool warns)"
    tool: Bash
    command: "setenv | grep bar"
    expect: warn

  # =============================================================================
  # Environment Dump (block-env-dump)
  # =============================================================================
  - name: "block-env-dump: standalone env"
    tool: Bash
    command: "env"
    expect: block

  - name: "block-env-dump: env with pipe"
    tool: Bash
    command: "env | head"
    expect: block

  - name: "block-env-dump: chained env"
    tool: Bash
    command: "mkdir /tmp && env"
    expect: block

  - name: "block-env-dump: env | sort (shows values)"
    tool: Bash
    command: "env | sort"
    expect: block

  - name: "block-env-dump: env | cut -d= -f2 (extracts values)"
    tool: Bash
    command: "env | cut -d= -f2"
    expect: block

  - name: "block-env-dump: env | cut -d= -f1,2 (extracts key+value)"
    tool: Bash
    command: "env | cut -d= -f1,2"
    expect: block

  - name: "block-env-dump: env | cut -d= -f1-2 (extracts key+value range)"
    tool: Bash
    command: "env | cut -d= -f1-2"
    expect: block

  - name: "block-env-dump: env | cut -d: -f1 (wrong delimiter leaks values)"
    tool: Bash
    command: "env | cut -d: -f1"
    expect: block

  - name: "block-env-dump: env -0 (null-delimited dump)"
    tool: Bash
    command: "env -0"
    expect: block

  - name: "block-env-dump: env -- (end-of-options dump)"
    tool: Bash
    command: "env --"
    expect: block

  - name: "block-env-dump: env --null (null-delimited dump)"
    tool: Bash
    command: "env --null"
    expect: block

  - name: "block-env-dump: env -0 | sort (flagged dump with pipe)"
    tool: Bash
    command: "env -0 | sort"
    expect: block

  - name: "block-env-dump: env -- | head (flagged dump with pipe)"
    tool: Bash
    command: "env -- | head"
    expect: block

  - name: "block-env-dump: env -- | cut -d= -f1 (flagged dump, safe pipe)"
    tool: Bash
    command: "env -- | cut -d= -f1"
    expect: allow

  - name: "block-env-dump: env | cut -d= -f1|sort (pipe without space after f1)"
    tool: Bash
    command: "env | cut -d= -f1|sort"
    expect: allow

  # Also proves env-dump allows this (tested in block-env-grep section too)
  - name: "block-env-dump: allows env | cut -d= -f1 (keys only)"
    tool: Bash
    command: "env | cut -d= -f1"
    expect: allow

  # Also proves env-dump allows this (tested in block-env-grep section too)
  - name: "block-env-dump: allows env | wc -l (count only)"
    tool: Bash
    command: "env | wc -l"
    expect: allow

  - name: "block-env-dump: allows env | wc (count only)"
    tool: Bash
    command: "env | wc"
    expect: allow

  - name: "block-env-dump: allows env | cut -d= -f1 | sort"
    tool: Bash
    command: "env | cut -d= -f1 | sort"
    expect: allow

  - name: "block-env-dump: env | cut -d= -f1 --complement (inverts to values)"
    tool: Bash
    command: "env | cut -d= -f1 --complement"
    expect: block

  - name: "block-env-dump: env | cut -d= -f1 -s (trailing flag after -f1)"
    tool: Bash
    command: "env | cut -d= -f1 -s"
    expect: block

  - name: "block-env-dump: allows env | cut -d= -f1; echo done"
    tool: Bash
    command: "env | cut -d= -f1; echo done"
    expect: allow

  - name: "block-env-dump: allows env VAR=value command"
    tool: Bash
    command: "env PATH=/bin command"
    expect: allow

  - name: "block-env-dump: env --zero --null (stacked dump flags)"
    tool: Bash
    command: "env --zero --null"
    expect: block

  - name: "block-env-dump: env -0 -- (stacked dump flags)"
    tool: Bash
    command: "env -0 --"
    expect: block

  - name: "block-env-dump: env -0 -- | cut -d= -f1 (stacked flags, safe pipe)"
    tool: Bash
    command: "env -0 -- | cut -d= -f1"
    expect: allow

  - name: "block-env-dump: allows env -i | sort (empty env, no secrets)"
    tool: Bash
    command: "env -i | sort"
    expect: allow

  - name: "block-env-dump: env > /tmp/file (redirect bypass blocked)"
    tool: Bash
    command: "env > /tmp/secrets.txt"
    expect: block

  - name: "block-env-dump: env >> /tmp/file (append redirect blocked)"
    tool: Bash
    command: "env >> /tmp/dump.txt"
    expect: block

  - name: "block-env-dump: env 1>/tmp/file (fd redirect blocked)"
    tool: Bash
    command: "env 1>/tmp/secrets.txt"
    expect: block

  - name: "block-env-dump: env &>/tmp/file (combined redirect blocked)"
    tool: Bash
    command: "env &>/tmp/secrets.txt"
    expect: block

  - name: "block-env-dump: env -u VARNAME (no command, dumps minus one var)"
    tool: Bash
    command: "env -u TERM"
    expect: block

  - name: "block-env-dump: env --unset=VARNAME (no command, dumps minus one var)"
    tool: Bash
    command: "env --unset=TERM"
    expect: block

  - name: "block-env-dump: env -u VAR1 -u VAR2 (stacked unset, still dumps)"
    tool: Bash
    command: "env -u TERM -u SHELL"
    expect: block

  - name: "block-env-dump: allows env -u SECRET command (unset var, runs cmd)"
    tool: Bash
    command: "env -u SECRET_KEY ./run.sh"
    expect: allow

  - name: "block-env-dump: allows env | cut --delimiter== --fields=1 (long form keys only)"
    tool: Bash
    command: "env | cut --delimiter== --fields=1"
    expect: allow

  - name: "block-env-dump: cross-line env + pipe not matched"
    tool: Bash
    command: "set environment\n| Name | Default |"
    expect: allow

  # =============================================================================
  # Printenv (block-printenv)
  # =============================================================================
  - name: "block-printenv: standalone printenv"
    tool: Bash
    command: "printenv"
    expect: block

  - name: "block-printenv: printenv with variable"
    tool: Bash
    command: "printenv SECRET_KEY"
    expect: block

  - name: "block-printenv: chained printenv"
    tool: Bash
    command: "ls && printenv"
    expect: block

  - name: "block-printenv: printenv | sort (shows values)"
    tool: Bash
    command: "printenv | sort"
    expect: block

  - name: "block-printenv: printenv | cut -d= -f2 (extracts values)"
    tool: Bash
    command: "printenv | cut -d= -f2"
    expect: block

  - name: "block-printenv: printenv | cut -d= -f1,2 (extracts key+value)"
    tool: Bash
    command: "printenv | cut -d= -f1,2"
    expect: block

  - name: "block-printenv: printenv | cut -d= -f1-2 (extracts key+value range)"
    tool: Bash
    command: "printenv | cut -d= -f1-2"
    expect: block

  - name: "block-printenv: printenv | cut -d: -f1 (wrong delimiter leaks values)"
    tool: Bash
    command: "printenv | cut -d: -f1"
    expect: block

  - name: "block-printenv: allows printenv | cut -d= -f1 (keys only)"
    tool: Bash
    command: "printenv | cut -d= -f1"
    expect: allow

  - name: "block-printenv: allows printenv | wc -l (count only)"
    tool: Bash
    command: "printenv | wc -l"
    expect: allow

  - name: "block-printenv: allows printenv | wc (count only)"
    tool: Bash
    command: "printenv | wc"
    expect: allow

  - name: "block-printenv: allows printenv | cut -d= -f1 | sort"
    tool: Bash
    command: "printenv | cut -d= -f1 | sort"
    expect: allow

  - name: "block-printenv: allows printenv | cut -d= -f1|sort (pipe without space after f1)"
    tool: Bash
    command: "printenv | cut -d= -f1|sort"
    expect: allow

  - name: "block-printenv: printenv | cut -d= -f1 --complement (inverts to values)"
    tool: Bash
    command: "printenv | cut -d= -f1 --complement"
    expect: block

  - name: "block-printenv: printenv | cut -d= -f1 -s (trailing flag after -f1)"
    tool: Bash
    command: "printenv | cut -d= -f1 -s"
    expect: block

  - name: "block-printenv: allows printenv | cut -d= -f1; echo done"
    tool: Bash
    command: "printenv | cut -d= -f1; echo done"
    expect: allow

  - name: "block-printenv: printenv HOME (named variable blocked)"
    tool: Bash
    command: "printenv HOME"
    expect: block

  - name: "block-printenv: printenv > /tmp/file (redirect bypass blocked)"
    tool: Bash
    command: "printenv > /tmp/secrets.txt"
    expect: block

  - name: "block-printenv: printenv >> /tmp/file (append redirect blocked)"
    tool: Bash
    command: "printenv >> /tmp/dump.txt"
    expect: block

  - name: "block-printenv: printenv 1>/tmp/file (fd redirect blocked)"
    tool: Bash
    command: "printenv 1>/tmp/secrets.txt"
    expect: block

  - name: "block-printenv: printenv&>/tmp/file (no-space combined redirect blocked)"
    tool: Bash
    command: "printenv&>/tmp/secrets.txt"
    expect: block

  - name: "block-printenv: allows printenv | cut --delimiter== --fields=1 (long form keys only)"
    tool: Bash
    command: "printenv | cut --delimiter== --fields=1"
    expect: allow

  - name: "block-printenv: cross-line printenv + pipe not matched"
    tool: Bash
    command: "run printenv\n| Name | Value |"
    expect: allow

  # =============================================================================
  # Process Environ (block-proc-environ)
  # =============================================================================
  - name: "block-proc-environ: cat /proc/self/environ"
    tool: Bash
    command: "cat /proc/self/environ"
    expect: block

  - name: "block-proc-environ: cat /proc/$$/environ"
    tool: Bash
    command: "cat /proc/$$/environ"
    expect: block

  - name: "block-proc-environ: cat /proc/1234/environ"
    tool: Bash
    command: "cat /proc/1234/environ"
    expect: block

  # NOTE: cat /proc/cpuinfo warns due to warn-use-read-tool (use Read tool instead)
  - name: "block-proc-environ: cat /proc/cpuinfo warns"
    tool: Bash
    command: "cat /proc/cpuinfo"
    expect: warn

  # =============================================================================
  # GPG Decrypt (block-gpg-decrypt)
  # =============================================================================
  - name: "block-gpg-decrypt: gpg -d"
    tool: Bash
    command: "gpg -d secrets.gpg"
    expect: block

  - name: "block-gpg-decrypt: gpg --decrypt"
    tool: Bash
    command: "gpg --decrypt secrets.gpg"
    expect: block

  - name: "block-gpg-decrypt: allows gpg --encrypt"
    tool: Bash
    command: "gpg --encrypt -r user@example.com file"
    expect: allow

  - name: "block-gpg-decrypt: allows gpg --list-keys"
    tool: Bash
    command: "gpg --list-keys"
    expect: allow

  # =============================================================================
  # OpenSSL Decrypt (block-openssl-decrypt)
  # =============================================================================
  - name: "block-openssl-decrypt: openssl enc -d"
    tool: Bash
    command: "openssl enc -d -aes-256-cbc -in file.enc"
    expect: block

  - name: "block-openssl-decrypt: openssl pkcs12"
    tool: Bash
    command: "openssl pkcs12 -in cert.p12"
    expect: block

  - name: "block-openssl-decrypt: allows openssl x509"
    tool: Bash
    command: "openssl x509 -in cert.pem -text"
    expect: allow

  - name: "block-openssl-decrypt: allows openssl genrsa"
    tool: Bash
    command: "openssl genrsa -out key.pem 2048"
    expect: allow

  # =============================================================================
  # Age Decrypt (block-age-decrypt)
  # =============================================================================
  - name: "block-age-decrypt: age -d"
    tool: Bash
    command: "age -d -i key.txt file.age"
    expect: block

  - name: "block-age-decrypt: age --decrypt"
    tool: Bash
    command: "age --decrypt file.age"
    expect: block

  - name: "block-age-decrypt: allows age encrypt"
    tool: Bash
    command: "age -r recipient -o file.age file"
    expect: allow

  - name: "block-age-decrypt: allows age-keygen"
    tool: Bash
    command: "age-keygen -o key.txt"
    expect: allow

  # =============================================================================
  # Shell Wrappers (warn-shell-wrappers)
  # =============================================================================
  - name: "warn-shell-wrappers: sh -c"
    tool: Bash
    command: "sh -c 'echo hello'"
    expect: warn

  - name: "warn-shell-wrappers: bash -c"
    tool: Bash
    command: "bash -c 'cat file'"
    expect: warn

  - name: "warn-shell-wrappers: eval"
    tool: Bash
    command: "eval 'printenv'"
    expect: warn

  - name: "warn-shell-wrappers: chained sh -c"
    tool: Bash
    command: "mkdir /tmp && sh -c 'cat /etc/passwd'"
    expect: warn

  - name: "warn-shell-wrappers: allows plain bash"
    tool: Bash
    command: "bash script.sh"
    expect: allow

  # =============================================================================
  # Use Read Tool (warn-use-read-tool)
  # =============================================================================
  - name: "warn-use-read-tool: cat file"
    tool: Bash
    command: "cat README.md"
    expect: warn

  - name: "warn-use-read-tool: cat chained"
    tool: Bash
    command: "cd /workspaces && cat /workspaces/providers.tf"
    expect: warn

  - name: "warn-use-read-tool: head file"
    tool: Bash
    command: "head -n 50 file.txt"
    expect: warn

  - name: "warn-use-read-tool: tail file"
    tool: Bash
    command: "tail -f logfile"
    expect: warn

  - name: "warn-use-read-tool: cat file | grep"
    tool: Bash
    command: "cat file.txt | grep pattern"
    expect: warn

  # =============================================================================
  # Use Grep Tool (warn-use-grep-tool)
  # =============================================================================
  - name: "warn-use-grep-tool: grep pattern"
    tool: Bash
    command: "grep 'TODO' src/"
    expect: warn

  - name: "warn-use-grep-tool: rg pattern"
    tool: Bash
    command: "rg 'function' --type js"
    expect: warn

  # =============================================================================
  # Use Edit Tool (warn-use-edit-tool)
  # =============================================================================
  - name: "warn-use-edit-tool: sed -i"
    tool: Bash
    command: "sed -i 's/old/new/g' file.txt"
    expect: warn

  - name: "warn-use-edit-tool: allows sed without -i"
    tool: Bash
    command: "sed 's/old/new/g' file.txt"
    expect: allow

  # =============================================================================
  # Use Glob Tool (warn-use-glob-tool)
  # =============================================================================
  - name: "warn-use-glob-tool: find path"
    tool: Bash
    command: "find . -name '*.ts'"
    expect: warn

  - name: "warn-use-glob-tool: ls directory"
    tool: Bash
    command: "ls -la src/"
    expect: warn

  - name: "warn-use-glob-tool: allows bare ls"
    tool: Bash
    command: "ls"
    expect: allow

  # =============================================================================
  # READ TOOL TESTS
  # =============================================================================

