# Shell reads of secret files after the command_match conversion.
test_cases:
  - name: 'block-shell-read-secret-files: blocks quoted command name'
    tool: Bash
    command: c''at ~/.npmrc
    expect: block
  - name: 'block-shell-read-secret-files: blocks split file name'
    tool: Bash
    command: cat ~/.np''mrc
    expect: block
  - name: 'block-shell-read-secret-files: blocks double quoted path with HOME'
    tool: Bash
    command: cat "$HOME/.aws/credentials"
    expect: block
  - name: 'block-shell-read-secret-files: blocks sudo reader'
    tool: Bash
    command: sudo cat /root/.ssh/id_rsa
    expect: block
  - name: 'block-shell-read-secret-files: blocks inside bash -c'
    tool: Bash
    command: bash -c 'cat ~/.npmrc'
    expect: block
  - name: 'block-shell-read-secret-files: blocks redirect read'
    tool: Bash
    command: cat < ~/.ssh/id_rsa
    expect: block
  - name: 'block-shell-read-secret-files: blocks while read loop'
    tool: Bash
    command: while read l; do echo $l; done < ~/.npmrc
    expect: block
  - name: 'block-shell-read-secret-files: blocks grep in file'
    tool: Bash
    command: grep TOKEN .env
    expect: block
  - name: 'block-shell-read-secret-files: blocks python open'
    tool: Bash
    command: python3 -c "print(open('secrets.yaml').read())"
    expect: block
  - name: 'block-shell-read-secret-files: blocks base64 a key'
    tool: Bash
    command: base64 ~/.ssh/id_rsa
    expect: block
  - name: 'block-shell-read-secret-files: blocks cp then read'
    tool: Bash
    command: cp ~/.aws/credentials /tmp/c && cat /tmp/c
    expect: block
  - name: 'block-shell-read-secret-files: blocks split dot name'
    tool: Bash
    command: cat ~/.ssh/i''d_rsa
    expect: block
  - name: 'block-shell-read-secret-files: allows commit message names the file'
    tool: Bash
    command: 'git commit -m "docs: never read .npmrc"'
    expect: allow
  - name: 'block-shell-read-secret-files: allows pr body names the file'
    tool: Bash
    command: 'gh pr create --title "fix: x" --body "stop reading secrets.yaml"'
    expect: allow
  - name: 'block-shell-read-secret-files: unwrapped commit message only gets the bash -c warning'
    tool: Bash
    command: 'bash -c ''git commit -m "docs: ignore .npmrc"'''
    expect: warn
  - name: 'block-shell-read-secret-files: public key only gets the read-tool warning'
    tool: Bash
    command: cat ~/.ssh/id_rsa.pub
    expect: warn
  - name: 'block-shell-read-secret-files: allows list the ssh dir'
    tool: Bash
    command: ls ~/.ssh
    expect: allow
  - name: 'block-shell-read-secret-files: allows encrypt with sops'
    tool: Bash
    command: sops -e -i secrets.yaml
    expect: allow
  - name: 'block-shell-read-secret-files: allows append a key'
    tool: Bash
    command: echo 'X=1' >> .env
    expect: allow
  - name: 'block-shell-read-secret-files: allows gitignore entry'
    tool: Bash
    command: echo '.env' >> .gitignore
    expect: allow
  - name: 'block-shell-read-secret-files: blocks bash running the file as a script'
    tool: Bash
    command: bash ~/.npmrc
    expect: block
  - name: 'block-shell-read-secret-files: blocks eval of a read'
    tool: Bash
    command: eval 'cat ~/.npmrc'
    expect: block
  - name: 'block-shell-read-secret-files: allows echo of the name into a non-script file'
    tool: Bash
    command: echo 'secrets.yaml' >> .dockerignore
    expect: allow
  - name: 'block-shell-read-secret-files: blocks echo of a read into a script'
    tool: Bash
    command: echo 'cat ~/.npmrc' > run.sh
    expect: block
