# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
# Repo-owned CI jobs; ci.yaml calls this after lint. See https://github.com/anthony-spruyt/repo-operator/blob/main/docs/ci.md

name: "CI (repo)"
on:
  workflow_call: {}
permissions: {}
jobs:
  test:
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
    steps:
      - name: "Harden Runner"
        uses: "anthony-spruyt/repo-operator/.github/actions/harden-runner@766304fb089600d37bc7a191eeb9befb32799b5a" # main
        with:
          allowed-endpoints: >-
            api.github.com:443
            azure.archive.ubuntu.com:80
            esm.ubuntu.com:443
            files.pythonhosted.org:443
            github.com:443
            packages.microsoft.com:443
            pypi.org:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7
      - uses: "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0" # v7
        with:
          python-version: "3.14"
      - name: "Install Python dependencies"
        run: "pip install --require-hashes --only-binary :all: -r .github/ci-requirements.txt"
      - name: "Run unit tests"
        run: "python -m pytest tests/unit/ -v"
      - name: "Install bats"
        run: "sudo apt-get update -qq && sudo apt-get install -y -qq bats bats-support bats-assert"
      - name: "Run integration tests"
        run: "bats tests/hooks/ -t"
      - name: "Run agent-kit tests"
        run: "bats tests/agent-kit/ -t"
      - name: "Run release config tests"
        run: "bats tests/release/ -t"
