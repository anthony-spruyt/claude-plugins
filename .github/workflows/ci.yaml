# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
# See https://github.com/anthony-spruyt/repo-operator/blob/main/src/templates/.github/workflows/ci.yaml for template comments

name: "CI"
on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"
permissions: {}
concurrency:
  group: "${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.action != 'labeled' && github.event.pull_request.number || github.run_id }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' && github.event.action != 'labeled' }}"
jobs:
  lint:
    permissions:
      actions: "read"
      contents: "read"
      security-events: "write"
    uses: "anthony-spruyt/repo-operator/.github/workflows/_lint.yaml@cb40ddc2ff6cd9f0441cd59406c849c68f6bd464"
  repo:
    needs:
      - "lint"
    permissions:
      contents: "read"
    uses: "./.github/workflows/ci-repo.yaml"
    secrets: "inherit"
  image:
    needs:
      - "lint"
      - "repo"
    if: "!cancelled() && needs.lint.result == 'success' && (needs.repo.result == 'success' || needs.repo.result == 'skipped')"
    permissions:
      contents: "read"
    uses: "anthony-spruyt/repo-operator/.github/workflows/_images.yaml@cb40ddc2ff6cd9f0441cd59406c849c68f6bd464"
  summary:
    needs:
      - "lint"
      - "repo"
      - "image"
      - "sonar"
    if: "always()"
    permissions:
      actions: "read"
      contents: "read"
    uses: "anthony-spruyt/repo-operator/.github/workflows/_summary.yaml@cb40ddc2ff6cd9f0441cd59406c849c68f6bd464"
  sonar:
    permissions: {}
    uses: "anthony-spruyt/repo-operator/.github/workflows/_sonar-new-issues.yaml@cb40ddc2ff6cd9f0441cd59406c849c68f6bd464"
