# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
# See https://github.com/anthony-spruyt/repo-operator/blob/main/src/templates/.github/workflows/ci.yaml for template comments

name: "CI"
on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"
permissions: {}
jobs:
  lint:
    permissions:
      actions: "read"
      contents: "read"
      security-events: "write"
    uses: "anthony-spruyt/repo-operator/.github/workflows/_lint.yaml@7bf816527b748801f0ac22002211ecdd00c2f64c" # main
  test:
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7
      - uses: "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97" # v7
        with:
          python-version: "3.14"
      - name: "Install Python dependencies"
        run: "pip install pytest pyyaml"
      - name: "Run unit tests"
        run: "python -m pytest tests/unit/ -v"
      - name: "Install bats"
        run: "sudo apt-get update -qq && sudo apt-get install -y -qq bats bats-support bats-assert"
      - name: "Run integration tests"
        run: "bats tests/hooks/ -t"
  summary:
    needs:
      - "lint"
      - "test"
    if: "always()"
    permissions:
      actions: "read"
      contents: "read"
    uses: "anthony-spruyt/repo-operator/.github/workflows/_summary.yaml@7bf816527b748801f0ac22002211ecdd00c2f64c" # main
